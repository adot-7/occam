[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occam"
version = "0.1.0"
description = "Causally ablated multi-agent architecture engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "textual>=0.70,<1",
  "httpx>=0.27,<1",
  "anthropic>=0.30,<1",
  "openai>=1.40,<2",
  "datasets>=2.20,<4",
  "pyarrow>=15,<22",
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
occam = "occam.cli:main"

[tool.setuptools.packages.find]
include = ["occam*"]

[tool.setuptools.package-data]
"occam.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures", "prd"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
